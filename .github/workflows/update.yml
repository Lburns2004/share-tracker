
name: Update share prices

on:
    schedule:
      - cron: "*/10 14-21 * * 1-5"
      - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance

      - name: Download share prices
        run: python update_data.py

      - name: Commit updated prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"

          git add data.json

          if ! git diff --cached --quiet; then
            git commit -m "Update share prices"
            git push
          else
            echo "No price changes to commit"
          fi
