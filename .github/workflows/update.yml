
name: Update share prices

on:
  schedule:
    # Every 10 minutes during US trading hours
    - cron: "3,13,23,33,43,53 9-15 * * 1-5"
      timezone: "America/New_York"

    # Final update after US market closes
    - cron: "3 16 * * 1-5"
      timezone: "America/New_York"

    # Daily backup
    - cron: "15 6 * * *"
      timezone: "Europe/London"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance

      - name: Update share prices
        run: python update_data.py

      - name: Check generated data
        run: |
          python -c "import json; d=json.load(open('data.json')); assert all(d['series'].get(t) for t in ['CIGI','J','WSPOF','VEOEF']); print('Data validated:', d['updated'])"

      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
